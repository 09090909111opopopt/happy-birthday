<!DOCTYPE html>
<html lang="vi">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Happy Birthday ❤️</title>


<!-- =========================
     GOOGLE FONTS
========================= -->

<link
href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&family=Caveat:wght@400;600;700&family=Dancing+Script:wght@400;600;700&family=Great+Vibes&family=Pacifico&family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,600&display=swap"
rel="stylesheet"
>


<style>

/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


/* =====================================================
   VARIABLES
===================================================== */

:root{

    --bg1:#f6a8c5;
    --bg2:#f9d4df;
    --bg3:#ffe4c3;

    --envelope:#ff4f8a;
    --envelope-light:#ff6aa0;
    --flap:#ff8db6;

    --accent:#ff4d88;
    --scroll:#ff7eaa;

    --font:"Caveat",cursive;
}


/* =====================================================
   BODY
===================================================== */

body{

    font-family:
        "Be Vietnam Pro",
        sans-serif;

    height:100vh;

    overflow:hidden;

    display:flex;

    justify-content:center;

    align-items:center;

    background:
        linear-gradient(
            135deg,
            var(--bg1),
            var(--bg2),
            var(--bg3)
        );

    transition:
        background 0.7s ease;
}


/* =====================================================
   BACKGROUND HEART
===================================================== */

.heart{

    position:absolute;

    color:#ff5b95;

    opacity:.55;

    animation:
        float linear infinite;

    pointer-events:none;
}


.spark{

    position:absolute;

    width:5px;
    height:5px;

    background:white;

    border-radius:50%;

    opacity:.7;

    animation:
        blink 2s infinite;

    pointer-events:none;
}


@keyframes float{

    from{

        transform:
            translateY(120vh)
            scale(.6);

    }

    to{

        transform:
            translateY(-20vh)
            scale(1.3);

    }

}


@keyframes blink{

    0%,100%{

        opacity:.2;

        transform:
            scale(.5);

    }

    50%{

        opacity:1;

        transform:
            scale(1.8);

    }

}


/* =====================================================
   CARD
===================================================== */

.container{

    position:relative;

    width:340px;

    height:420px;

    cursor:pointer;

    perspective:1000px;

    z-index:5;
}


/* =====================================================
   HINT
===================================================== */

.hint{

    position:absolute;

    bottom:-55px;

    width:100%;

    text-align:center;

    color:white;

    font-weight:700;

    text-shadow:
        0 2px 8px rgba(0,0,0,.25);

    transition:.4s;

}


.container.open .hint{

    opacity:0;

}


/* =====================================================
   ENVELOPE
===================================================== */

.envelope{

    position:absolute;

    bottom:0;

    width:100%;

    height:230px;

    filter:
        drop-shadow(
            0 15px 25px
            rgba(0,0,0,.12)
        );
}


.back{

    position:absolute;

    inset:0;

    background:
        var(--envelope);

    border-radius:
        0 0 18px 18px;

    transition:
        background .5s ease;
}


.front{

    position:absolute;

    inset:0;

    background:
        var(--envelope-light);

    clip-path:
        polygon(
            0 0,
            50% 52%,
            100% 0,
            100% 100%,
            0 100%
        );

    transition:
        background .5s ease;
}


.flap{

    position:absolute;

    top:0;

    width:100%;

    height:120px;

    background:
        var(--flap);

    clip-path:
        polygon(
            0 0,
            100% 0,
            50% 100%
        );

    transform-origin:top;

    transition:
        1s cubic-bezier(.22,1,.36,1);

    z-index:6;
}


.container.open .flap{

    transform:
        rotateX(180deg);

    z-index:1;
}


/* =====================================================
   LETTER
===================================================== */

.letter{

    position:absolute;

    left:50%;

    bottom:22px;

    transform:
        translateX(-50%);

    width:88%;

    height:170px;

    background:white;

    border-radius:16px;

    padding:20px;

    box-shadow:
        0 18px 40px
        rgba(0,0,0,.22);

    overflow:hidden;

    z-index:3;

    display:flex;

    flex-direction:column;

    transition:
        bottom 1.1s cubic-bezier(.22,1,.36,1),
        transform 1.1s cubic-bezier(.22,1,.36,1),
        height .5s;
}


.container.open .letter{

    bottom:155px;

    height:305px;

    transform:
        translateX(-50%)
        scale(1.05);

    animation:
        pop .9s cubic-bezier(.22,1,.36,1);
}


@keyframes pop{

    0%{

        transform:
            translateX(-50%)
            translateY(40px)
            scale(.8);

        opacity:0;

    }

    60%{

        transform:
            translateX(-50%)
            translateY(-10px)
            scale(1.08);

        opacity:1;

    }

    100%{

        transform:
            translateX(-50%)
            scale(1.05);

    }

}


/* =====================================================
   LETTER TITLE
===================================================== */

.title{

    font-size:30px;

    text-align:center;

    color:
        var(--accent);

    margin-bottom:15px;

    font-family:
        var(--font);

    font-weight:700;

    flex-shrink:0;

    transition:
        color .4s;
}


/* =====================================================
   LETTER TEXT
===================================================== */

.text{

    font-family:
        var(--font);

    font-size:19px;

    line-height:1.7;

    color:#444;

    white-space:pre-wrap;

    flex:1;

    overflow-y:auto;

    overflow-x:hidden;

    padding-right:10px;

    scroll-behavior:smooth;

    -webkit-overflow-scrolling:touch;

    scrollbar-width:thin;

    scrollbar-color:
        var(--scroll)
        #ffe6ef;
}


.text::-webkit-scrollbar{

    width:6px;
}


.text::-webkit-scrollbar-track{

    background:#ffe6ef;

    border-radius:10px;
}


.text::-webkit-scrollbar-thumb{

    background:
        var(--scroll);

    border-radius:10px;
}


.text::-webkit-scrollbar-thumb:hover{

    background:
        var(--accent);

}


/* =====================================================
   SHINE
===================================================== */

.shine{

    position:absolute;

    inset:0;

    background:
        linear-gradient(
            120deg,
            transparent 30%,
            rgba(255,255,255,.45) 50%,
            transparent 70%
        );

    transform:
        translateX(-120%);

    pointer-events:none;
}


.container.open .shine{

    animation:
        shineMove 1.5s .5s forwards;
}


@keyframes shineMove{

    to{

        transform:
            translateX(120%);

    }

}


/* =====================================================
   CONTROL BUTTONS
===================================================== */

.control-buttons{

    position:fixed;

    left:22px;

    bottom:22px;

    display:flex;

    gap:9px;

    z-index:30;
}


.control-button{

    border:none;

    padding:
        11px 16px;

    border-radius:30px;

    background:
        rgba(255,255,255,.94);

    color:
        var(--accent);

    font-family:
        "Be Vietnam Pro",
        sans-serif;

    font-size:13px;

    font-weight:700;

    cursor:pointer;

    box-shadow:
        0 8px 25px
        rgba(0,0,0,.15);

    transition:.3s;
}


.control-button:hover{

    transform:
        translateY(-3px);

    box-shadow:
        0 12px 30px
        rgba(0,0,0,.2);
}


.retry-button{

    display:none;
}


.retry-button.show{

    display:block;

    animation:
        fadeButton .5s ease;
}


@keyframes fadeButton{

    from{

        opacity:0;

        transform:
            translateY(10px);

    }

    to{

        opacity:1;

        transform:
            translateY(0);

    }

}


/* =====================================================
   EDITOR OVERLAY
===================================================== */

.editor-overlay{

    position:fixed;

    inset:0;

    background:
        rgba(0,0,0,.35);

    backdrop-filter:
        blur(8px);

    display:flex;

    justify-content:center;

    align-items:center;

    padding:20px;

    opacity:0;

    visibility:hidden;

    transition:.3s;

    z-index:100;
}


.editor-overlay.show{

    opacity:1;

    visibility:visible;
}


.editor{

    width:100%;

    max-width:500px;

    max-height:90vh;

    overflow-y:auto;

    background:white;

    border-radius:22px;

    padding:25px;

    box-shadow:
        0 25px 70px
        rgba(0,0,0,.25);

    transform:
        translateY(30px)
        scale(.95);

    transition:.35s;
}


.editor-overlay.show .editor{

    transform:
        translateY(0)
        scale(1);
}


.editor-title{

    text-align:center;

    color:
        var(--accent);

    font-family:
        "Caveat",
        cursive;

    font-size:32px;

    margin-bottom:5px;
}


.editor-subtitle{

    text-align:center;

    color:#888;

    font-size:13px;

    margin-bottom:18px;
}


/* =====================================================
   TEXTAREA
===================================================== */

#messageInput{

    width:100%;

    height:230px;

    resize:none;

    border:
        2px solid #ffd0df;

    border-radius:15px;

    outline:none;

    padding:15px;

    font-family:
        var(--font);

    font-size:19px;

    line-height:1.6;

    color:#444;

    transition:.3s;
}


#messageInput:focus{

    border-color:
        var(--accent);

    box-shadow:
        0 0 0 4px
        rgba(255,126,170,.12);
}


/* =====================================================
   SELECT AREA
===================================================== */

.settings-title{

    font-weight:700;

    color:#555;

    font-size:14px;

    margin-top:18px;

    margin-bottom:8px;
}


.select-grid{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:10px;
}


.select-box{

    border:
        2px solid #f3d9e2;

    border-radius:12px;

    padding:10px;

    background:#fff;

    cursor:pointer;

    transition:.25s;
}


.select-box:hover{

    border-color:
        var(--accent);

    transform:
        translateY(-2px);
}


.select-box.active{

    border-color:
        var(--accent);

    background:#fff0f5;

    box-shadow:
        0 4px 15px
        rgba(255,77,136,.12);
}


.select-name{

    font-weight:700;

    font-size:13px;

    color:#555;

    margin-bottom:4px;
}


.select-preview{

    height:9px;

    border-radius:10px;

    background:
        var(--preview);

}


/* =====================================================
   FONT PREVIEW
===================================================== */

.font-option{

    border:
        2px solid #f3d9e2;

    border-radius:12px;

    padding:9px 12px;

    cursor:pointer;

    transition:.25s;

    background:white;
}


.font-option:hover{

    border-color:
        var(--accent);

}


.font-option.active{

    border-color:
        var(--accent);

    background:#fff0f5;
}


.font-preview{

    font-size:21px;

    color:#444;
}


/* =====================================================
   EDITOR BUTTONS
===================================================== */

.editor-buttons{

    display:flex;

    gap:10px;

    margin-top:18px;
}


.editor-buttons button{

    flex:1;

    border:none;

    padding:12px 10px;

    border-radius:12px;

    font-family:
        "Be Vietnam Pro",
        sans-serif;

    font-weight:700;

    cursor:pointer;

    transition:.25s;
}


.save-button{

    background:
        var(--accent);

    color:white;
}


.save-button:hover{

    filter:
        brightness(.92);

    transform:
        translateY(-2px);
}


.reset-button{

    background:#ffe6ef;

    color:
        var(--accent);
}


.close-button{

    background:#f1f1f1;

    color:#666;
}


/* =========================
   CREDIT
========================= */

.credit{

    position:fixed;

    bottom:12px;

    left:50%;

    transform:translateX(-50%);

    color:white;

    font-size:13px;

    font-weight:700;

    letter-spacing:1px;

    white-space:nowrap;

    z-index:50;

    text-shadow:
        0 0 5px rgba(255,255,255,.8),
        0 0 10px rgba(255,100,180,.8),
        0 0 20px rgba(255,100,180,.6),
        0 0 35px rgba(255,100,180,.5);

    animation:
        creditGlow 3s ease-in-out infinite,
        creditFloat 4s ease-in-out infinite;
}

/* Phát sáng */

@keyframes creditGlow{

    0%,100%{

        opacity:.8;

        text-shadow:
            0 0 5px rgba(255,255,255,.8),
            0 0 10px rgba(255,100,180,.8),
            0 0 20px rgba(255,100,180,.6),
            0 0 35px rgba(255,100,180,.5);
    }

    50%{

        opacity:1;

        text-shadow:
            0 0 10px white,
            0 0 20px #ff80bf,
            0 0 35px #ff5b95,
            0 0 55px #ff5b95;
    }

}

/* Bay nhẹ */

@keyframes creditFloat{

    0%,100%{

        transform:
            translateX(-50%)
            translateY(0px);

    }

    50%{

        transform:
            translateX(-50%)
            translateY(-6px);

    }

}

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:500px){

    .container{

        width:320px;

        height:400px;
    }


    .letter{

        width:88%;
    }


    .container.open .letter{

        height:300px;
    }


    .title{

        font-size:28px;
    }


    .text{

        font-size:18px;
    }


    .control-buttons{

        left:50%;

        transform:
            translateX(-50%);

        bottom:40px;

        width:100%;

        justify-content:center;
    }


    .control-button{

        padding:
            9px 13px;

        font-size:12px;
    }


    .credit{

        bottom:10px;

        font-size:10px;
    }


    .select-grid{

        grid-template-columns:
            1fr 1fr;
    }

}


/* =====================================================
   BURST HEART
===================================================== */

.burst-heart{

    position:absolute;

    pointer-events:none;

    transition:
        1.2s ease-out;
}

</style>
</head>


<body>


<!-- =====================================================
     BACKGROUND EFFECTS
===================================================== -->

<div id="effects"></div>


<!-- =====================================================
     BIRTHDAY CARD
===================================================== -->

<div
    class="container"
    id="card"
>


    <!-- LETTER -->

    <div class="letter">

        <div class="shine"></div>

        <div class="title">
            Happy Birthday 🎂
        </div>

        <div
            class="text"
            id="typing"
        ></div>

    </div>


    <!-- ENVELOPE -->

    <div class="envelope">

        <div class="back"></div>

        <div class="front"></div>

        <div class="flap"></div>

    </div>


    <!-- HINT -->

    <div class="hint">

        💌 Bấm vào bức thư

    </div>

</div>


<!-- =====================================================
     CONTROL BUTTONS
===================================================== -->

<div class="control-buttons">

    <button
        class="control-button"
        id="editButton"
    >

        ✏️ Viết lại

    </button>


    <button
        class="control-button"
        id="styleButton"
    >

        🎨 Style

    </button>


    <button
        class="control-button retry-button"
        id="retryButton"
    >

        🔄 Retry

    </button>

</div>


<!-- =====================================================
     EDITOR
===================================================== -->

<div
    class="editor-overlay"
    id="editorOverlay"
>

    <div class="editor">

        <div class="editor-title">
            ✏️ Viết lời chúc
        </div>

        <div class="editor-subtitle">
            Viết lời chúc riêng của bạn 💖
        </div>


        <textarea
            id="messageInput"
            placeholder="Nhập lời chúc..."
        ></textarea>


        <!-- =========================
             ENVELOPE STYLE
        ========================= -->

        <div class="settings-title">
            💌 Kiểu phong thư
        </div>

        <div
            class="select-grid"
            id="envelopeOptions"
        >

            <div
                class="select-box active"
                data-style="pink"
            >

                <div class="select-name">
                    🌸 Pink Love
                </div>

                <div
                    class="select-preview"
                    style="
                        --preview:
                        linear-gradient(
                            90deg,
                            #ff4f8a,
                            #ff8db6
                        );
                    "
                ></div>

            </div>


            <div
                class="select-box"
                data-style="rose"
            >

                <div class="select-name">
                    🌹 Rose
                </div>

                <div
                    class="select-preview"
                    style="
                        --preview:
                        linear-gradient(
                            90deg,
                            #c9184a,
                            #ff758f
                        );
                    "
                ></div>

            </div>


            <div
                class="select-box"
                data-style="purple"
            >

                <div class="select-name">
                    💜 Purple Dream
                </div>

                <div
                    class="select-preview"
                    style="
                        --preview:
                        linear-gradient(
                            90deg,
                            #7b2cbf,
                            #c77dff
                        );
                    "
                ></div>

            </div>


            <div
                class="select-box"
                data-style="blue"
            >

                <div class="select-name">
                    💙 Blue Sky
                </div>

                <div
                    class="select-preview"
                    style="
                        --preview:
                        linear-gradient(
                            90deg,
                            #277da1,
                            #90e0ef
                        );
                    "
                ></div>

            </div>

        </div>


        <!-- =========================
             FONT STYLE
        ========================= -->

        <div class="settings-title">
            🔤 Kiểu chữ
        </div>

        <div
            class="select-grid"
            id="fontOptions"
        >

            <div
                class="font-option active"
                data-font="Caveat"
            >

                <div
                    class="font-preview"
                    style="font-family:'Caveat',cursive;"
                >
                    Happy Birthday
                </div>

            </div>


            <div
                class="font-option"
                data-font="Dancing Script"
            >

                <div
                    class="font-preview"
                    style="font-family:'Dancing Script',cursive;"
                >
                    Happy Birthday
                </div>

            </div>


            <div
                class="font-option"
                data-font="Pacifico"
            >

                <div
                    class="font-preview"
                    style="font-family:'Pacifico',cursive;"
                >
                    Happy Birthday
                </div>

            </div>


            <div
                class="font-option"
                data-font="Great Vibes"
            >

                <div
                    class="font-preview"
                    style="font-family:'Great Vibes',cursive;"
                >
                    Happy Birthday
                </div>

            </div>


            <div
                class="font-option"
                data-font="Playfair Display"
            >

                <div
                    class="font-preview"
                    style="font-family:'Playfair Display',serif;"
                >
                    Happy Birthday
                </div>

            </div>


            <div
                class="font-option"
                data-font="Be Vietnam Pro"
            >

                <div
                    class="font-preview"
                    style="font-family:'Be Vietnam Pro',sans-serif;"
                >
                    Happy Birthday
                </div>

            </div>

        </div>


        <!-- =========================
             BUTTONS
        ========================= -->

        <div class="editor-buttons">

            <button
                class="reset-button"
                id="resetButton"
            >
                ↩️ Mặc định
            </button>


            <button
                class="close-button"
                id="closeButton"
            >
                Đóng
            </button>


            <button
                class="save-button"
                id="saveButton"
            >
                💾 Lưu
            </button>

        </div>

    </div>

</div>


<!-- =====================================================
     CREDIT
===================================================== -->

<div class="credit">
    Make By Le Trung Hieu ❤️
</div>


<script>

/* =====================================================
   ELEMENTS
===================================================== */

const card =
    document.getElementById("card");

const typing =
    document.getElementById("typing");

const editButton =
    document.getElementById("editButton");

const styleButton =
    document.getElementById("styleButton");

const retryButton =
    document.getElementById("retryButton");

const editorOverlay =
    document.getElementById("editorOverlay");

const messageInput =
    document.getElementById("messageInput");

const saveButton =
    document.getElementById("saveButton");

const closeButton =
    document.getElementById("closeButton");

const resetButton =
    document.getElementById("resetButton");

const envelopeOptions =
    document.getElementById(
        "envelopeOptions"
    );

const fontOptions =
    document.getElementById(
        "fontOptions"
    );


/* =====================================================
   DEFAULT MESSAGE
===================================================== */

const defaultMessage = `Chúc mừng sinh nhật nhé!

Mong hôm nay sẽ là một ngày thật nhiều niềm vui, tiếng cười và những điều bất ngờ.

Chúc cậu luôn mạnh khỏe, hạnh phúc và đạt được mọi điều mình mong muốn.

Hy vọng mỗi ngày sau này đều sẽ rực rỡ như chính nụ cười của cậu.

Happy Birthday! ❤️`;


/* =====================================================
   LOAD SAVED DATA
===================================================== */

let message =
    localStorage.getItem(
        "birthdayMessage"
    ) || defaultMessage;


let selectedEnvelope =
    localStorage.getItem(
        "birthdayEnvelope"
    ) || "pink";


let selectedFont =
    localStorage.getItem(
        "birthdayFont"
    ) || "Caveat";


/* =====================================================
   STATE
===================================================== */

let opened = false;

let finished = false;

let typingTimer = null;


/* =====================================================
   ENVELOPE THEMES
===================================================== */

const themes = {

    pink:{
        bg1:"#f6a8c5",
        bg2:"#f9d4df",
        bg3:"#ffe4c3",

        envelope:"#ff4f8a",
        light:"#ff6aa0",
        flap:"#ff8db6",

        accent:"#ff4d88",
        scroll:"#ff7eaa"
    },


    rose:{
        bg1:"#ffb3c6",
        bg2:"#ffe5ec",
        bg3:"#fff0f3",

        envelope:"#c9184a",
        light:"#ff4d6d",
        flap:"#ff758f",

        accent:"#c9184a",
        scroll:"#ff758f"
    },


    purple:{
        bg1:"#cdb4db",
        bg2:"#e5d4ef",
        bg3:"#f5e8ff",

        envelope:"#7b2cbf",
        light:"#9d4edd",
        flap:"#c77dff",

        accent:"#7b2cbf",
        scroll:"#9d4edd"
    },


    blue:{
        bg1:"#90dbf4",
        bg2:"#caf0f8",
        bg3:"#e8f8ff",

        envelope:"#277da1",
        light:"#48cae4",
        flap:"#90e0ef",

        accent:"#277da1",
        scroll:"#48cae4"
    }

};


/* =====================================================
   APPLY THEME
===================================================== */

function applyTheme(){

    const theme =
        themes[selectedEnvelope];

    document.documentElement
        .style
        .setProperty("--bg1", theme.bg1);

    document.documentElement
        .style
        .setProperty("--bg2", theme.bg2);

    document.documentElement
        .style
        .setProperty("--bg3", theme.bg3);

    document.documentElement
        .style
        .setProperty("--envelope", theme.envelope);

    document.documentElement
        .style
        .setProperty("--envelope-light", theme.light);

    document.documentElement
        .style
        .setProperty("--flap", theme.flap);

    document.documentElement
        .style
        .setProperty("--accent", theme.accent);

    document.documentElement
        .style
        .setProperty("--scroll", theme.scroll);

    document.documentElement
        .style
        .setProperty(
            "--font",
            `"${selectedFont}"`
        );


    /* =========================
       LƯU TỰ ĐỘNG
    ========================= */

    localStorage.setItem(
        "birthdayEnvelope",
        selectedEnvelope
    );

    localStorage.setItem(
        "birthdayFont",
        selectedFont
    );


    /* =========================
       UPDATE ACTIVE STYLE
    ========================= */

    document
        .querySelectorAll(".select-box")
        .forEach(box => {

            box.classList.toggle(
                "active",
                box.dataset.style ===
                selectedEnvelope
            );

        });


    document
        .querySelectorAll(".font-option")
        .forEach(option => {

            option.classList.toggle(
                "active",
                option.dataset.font ===
                selectedFont
            );

        });

}


/* Apply when page loads */

applyTheme();


/* =====================================================
   OPEN CARD
===================================================== */

card.onclick = () => {

    if(opened) return;

    opened = true;

    finished = false;

    retryButton.classList.remove(
        "show"
    );

    card.classList.add("open");

    setTimeout(
        typeText,
        1200
    );

    /* Hiện nút Retry sau 3 giây */
    setTimeout(() => {

        retryButton.classList.add("show");

    }, 3000);

};


/* =====================================================
   TYPE MESSAGE
===================================================== */

function typeText(){

    let i = 0;

    typing.textContent = "";


    const sound =
        new Audio(
            "https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg"
        );


    sound.volume = .2;

    sound.play().catch(()=>{});


    typingTimer =
        setInterval(() => {

            typing.textContent +=
                message.charAt(i);


            i++;


            /*
             * Tự động cuộn xuống
             */

            typing.scrollTop =
                typing.scrollHeight;


            if(i >= message.length){

                clearInterval(
                    typingTimer
                );

                launchHearts();

            }

        },35);

}


/* =====================================================
   RETRY
===================================================== */

retryButton.onclick = (event) => {

    event.stopPropagation();


    /*
     * Dừng typing cũ
     */

    if(typingTimer){

        clearInterval(
            typingTimer
        );

        typingTimer = null;

    }


    /*
     * Xóa chữ
     */

    typing.textContent = "";


    /*
     * Reset trạng thái
     */

    opened = false;

    finished = false;


    /*
     * Ẩn Retry
     */

    retryButton.classList.remove(
        "show"
    );


    /*
     * Đóng phong thư
     */

    card.classList.remove(
        "open"
    );


    /*
     * Sau khi đóng xong,
     * cho phép mở lại
     */

    setTimeout(() => {

        typing.scrollTop = 0;

    },700);

};

/* =====================================================
   SAVE
===================================================== */

saveButton.onclick = () => {

    const newMessage =
        messageInput.value.trim();


    if(!newMessage){

        alert(
            "⚠️ Bạn chưa nhập lời chúc!"
        );

        return;

    }


    message =
        newMessage;


    localStorage.setItem(
        "birthdayMessage",
        message
    );


    localStorage.setItem(
        "birthdayEnvelope",
        selectedEnvelope
    );


    localStorage.setItem(
        "birthdayFont",
        selectedFont
    );


    /*
     * Nếu thư đang mở,
     * cập nhật nội dung ngay
     */

    if(opened){

        if(typingTimer){

            clearInterval(
                typingTimer
            );

        }


        typing.textContent =
            message;


        typing.scrollTop = 0;

    }


    editorOverlay.classList.remove(
        "show"
    );

};

/* =====================================================
   BURST HEARTS
===================================================== */

function launchHearts(){

    for(
        let i = 0;
        i < 25;
        i++
    ){

        const h =
            document.createElement(
                "div"
            );


        h.className =
            "burst-heart";


        h.innerHTML =
            "💖";


        h.style.left =
            "50%";


        h.style.top =
            "55%";


        h.style.fontSize =
            (18 + Math.random() * 16)
            + "px";


        document.body.appendChild(h);


        requestAnimationFrame(() => {

            const x =
                (Math.random() - .5)
                * 420;


            const y =
                (Math.random() - .8)
                * 320;


            h.style.transform =
                `translate(${x}px,${y}px) scale(1.4)`;


            h.style.opacity =
                0;

        });


        setTimeout(() => {

            h.remove();

        },1300);

    }

}
